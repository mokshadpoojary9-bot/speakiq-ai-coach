# SpeakIQ AI Coach - master project specification.
# Durable source of truth for all milestones. Supplied by the project owner on 2026-10-11.
#
# NOTE ON THE `milestones` SECTION: the owner's pasted specification was cut off part-way
# through milestone 1 (the text ended at `- "Save`). Everything above `milestones` is the
# owner's text verbatim. Milestones 1 and 2 below were reconstructed from the owner's
# separate Milestone 1 and Milestone 2 build prompts. Milestone 3 is recorded as far as its
# (also truncated) build prompt went. Later milestones were not received and must be added
# by the owner; do not invent them.

project:
  name: "SpeakIQ AI Coach"
  slug: "speakiq-ai-coach"
  purpose: "Evidence-first speech delivery analysis with temporally grounded explanations."
  target_track: "Contrastive Speech Analytics & Temporal Flaw Grounding"
  product_type: "Web application"
  principles:
    - "Every detected flaw must be tied to a specific audio interval."
    - "Distinguish measured facts, inferred explanations, and unavailable evidence."
    - "Never invent analysis metrics or pretend demo data is live."
    - "Make processing reproducible and explain limitations."
    - "Provide a useful fallback when optional models or WebGL are unavailable."

requirements:
  dataset:
    - "Create paired baseline and intentionally flawed speech examples using the same transcript."
    - "Represent multiple flaw types and a severity gradient from poor to near-perfect delivery."
    - "Store transcripts, metadata, labels, and temporal intervals with the audio."
    - "Prefer a small, well-labelled, reproducible dataset over a large, unreliable one."
    - "Document dataset provenance, generation procedures, licensing, and limitations."
  audio_analysis:
    - "Extract waveform and spectral features using appropriate signal-processing libraries."
    - "Support MFCCs, pitch/F0 contours, speech rate, pause intervals, energy, and clarity proxies where available."
    - "Use forced alignment to associate transcript words with audio timestamps when supported."
    - "Normalize speaker-dependent pitch and energy carefully."
    - "Do not claim a metric was measured if the pipeline did not calculate it."
  temporal_grounding:
    - "Produce flaw intervals with start and end times."
    - "Compare participant delivery against a suitable baseline."
    - "Associate each explanation with the measured features and reference comparison that support it."
    - "Clearly identify low-confidence results and missing alignment."
  dashboard:
    - "Provide audio and transcript upload."
    - "Show audio playback, waveform, and timeline."
    - "Show baseline-versus-participant feature comparisons."
    - "Highlight temporally grounded flaw intervals."
    - "Show the evidence, severity, confidence, and limitations for each finding."
    - "Include an accessible 2D fallback for every essential WebGL visualization."
  coach:
    - "Provide actionable, evidence-backed speech coaching."
    - "Use measured analysis and rubric retrieval when generating feedback."
    - "Provide a deterministic rule-based fallback when an optional language-model API is unavailable."
    - "Never generate unsupported causal claims."
  visualization:
    - "Use a professional, premium dark interface with restrained green accents."
    - "Use React, Three.js, and React Three Fiber for a data-driven 3D Acoustic Twin where appropriate."
    - "Use supplied sample data for demonstrations; never invent live metrics."
    - "Include keyboard accessibility, visible focus states, responsive layouts, and reduced-motion support."

technology:
  frontend:
    - "React"
    - "Vite"
    - "TypeScript"
    - "Tailwind CSS"
    - "React Router"
    - "TanStack Query where useful"
    - "WaveSurfer.js"
    - "Recharts"
    - "Three.js"
    - "@react-three/fiber"
    - "@react-three/drei"
  backend:
    - "Python"
    - "FastAPI"
    - "Pydantic"
    - "NumPy"
    - "SciPy"
    - "librosa"
    - "Parselmouth where appropriate"
    - "faster-whisper or a compatible transcription option"
    - "A compatible forced-alignment implementation"
  testing:
    frontend:
      - "Vitest"
      - "React Testing Library"
      - "Playwright for essential end-to-end checks"
    backend:
      - "pytest"
  persistence:
    default: "Local development and documented sample data first"
    optional: "Supabase when persistence or authentication is actually implemented"
  hosting:
    frontend: "Vercel or another compatible host"
    backend: "Render or another compatible host"
  external_services:
    - "No paid API is required to begin development."
    - "Do not block local development while waiting for optional API credentials."
    - "Do not introduce NVIDIA or Nebius integrations unless explicitly required by this project's actual track."

architecture:
  frontend_directory: "frontend/"
  backend_directory: "backend/"
  documentation_directory: "docs/"
  dataset_directory: "data/"
  frontend_responsibilities:
    - "Accessible upload and playback"
    - "Timeline and comparison visualizations"
    - "Evidence presentation"
    - "3D visualization with a 2D fallback"
  backend_responsibilities:
    - "Input validation"
    - "Audio preprocessing"
    - "Feature extraction"
    - "Transcription and alignment adapters"
    - "Contrastive analysis"
    - "Evidence-backed explanations"
  api:
    - "Health endpoint"
    - "Analysis endpoint"
    - "Results endpoint or documented synchronous equivalent"
    - "Dataset/sample endpoint if required"
  data_contract:
    - "Use explicit types and schemas."
    - "Represent time in seconds."
    - "Validate interval start and end values."
    - "Include evidence, confidence, and limitations where applicable."
    - "Mark sample/demo data clearly."

security:
  - "Keep `.env` files ignored by Git."
  - "Commit only placeholder values in `.env.example`."
  - "Never put secret keys in frontend environment variables or client bundles."
  - "Never expose Supabase secret/service-role credentials to the browser."
  - "Validate uploaded file type, size, and processing limits."
  - "Do not log secrets or unnecessarily retain uploaded audio."
  - "Use optional external APIs only when configured."
  - "Never fabricate credentials, test results, deployments, or API responses."

milestones:
  - id: 1
    name: "Repository foundation and specification"
    source: "Reconstructed from the owner's Milestone 1 build prompt (pasted spec was truncated here)."
    tasks:
      - "Save the complete master specification to docs/PROJECT_SPEC.yaml."
      - "Create or update CLAUDE.md with the project instructions and Git safety policy."
      - "Create a secure .gitignore and a .env.example containing placeholders only."
      - "Create the frontend/ React + Vite + TypeScript application."
      - "Create the backend/ Python + FastAPI application."
      - "Add a working GET /health endpoint."
      - "Add basic frontend and backend tests."
      - "Add a README explaining installation, environment setup and local development."
      - "Do not require paid API keys. Do not connect Supabase, an LLM provider, NVIDIA, Nebius, Vercel or Render yet."
      - "Install dependencies, run tests and production builds, inspect the Git diff, and fix issues."
  - id: 2
    name: "Frontend experience with demo fixtures"
    source: "Reconstructed from the owner's Milestone 2 build prompt."
    tasks:
      - "A professional landing page explaining the product."
      - "A workspace for uploading audio and entering transcripts."
      - "An analysis dashboard with waveform, finding-list and chart placeholders."
      - "An Acoustic Twin visualization using Three.js, React Three Fiber and Drei, displaying supplied sample data, with a useful 2D fallback when WebGL is unavailable."
      - "An Evidence Coach page or panel."
      - "A reports page or report-preview view."
      - "Navigation, reusable components, loading states, empty states and error states."
      - "Premium dark theme with restrained green accents, strong typography, consistent spacing, subtle motion, keyboard accessibility and visible focus states."
      - "Use clearly labelled demo fixtures until the real backend is connected."
      - "Add frontend tests and verify the production build."
      - "Do not add paid services or API keys."
  - id: 3
    name: "Real audio feature extraction"
    source: "From the owner's Milestone 3 build prompt, which was cut off part-way through item 7 of the feature list. Only the received items are recorded; later items and sections were not received."
    tasks:
      - "Create a modular audio-analysis service in the existing Python backend using appropriate compatible libraries, such as NumPy, SciPy, librosa, and Parselmouth."
      - "For supported audio uploads, calculate actual measurements where technically appropriate."
      - "Audio duration and sample rate."
      - "Waveform and frame-level amplitude or energy."
      - "Short-time Fourier transform (STFT) and spectral features."
      - "Mel-frequency cepstral coefficients (MFCCs)."
      - "Fundamental frequency (F0) and pitch contours."
      - "Silence and pause intervals."
      - "Speaking-rate estimates, clearly [text cut off here]"
  - id: 4
    name: "Speech transcription, forced alignment, Hugging Face and backend API"
    source: "Summarised from the owner's Milestone 4 build prompt, which was received in full."
    tasks:
      - "Speech pipeline: audio upload and validation, transcription with a suitable compatible model, and word-level alignment mapping transcript words to start and end timestamps, in a consistent response format."
      - "Clear handling of unsupported audio, empty uploads, model failures, missing dependencies, and alignment errors. Prefer practical local inference. Never fabricate transcripts, timestamps, confidence scores, or alignment results; report unavailable components honestly with a clear fallback."
      - "Hugging Face: check whether the model needs authentication. If it does, read the token only from the backend environment variable HF_TOKEN in backend/.env (ignored by Git), with an empty placeholder in backend/.env.example. Never print, log, or expose the token to the browser or any VITE_ variable."
      - "Backend API: GET /api/health, POST /api/transcribe, POST /api/align, POST /api/analyze, with Pydantic models, validation, useful error responses and upload limits. Reuse existing routes rather than duplicating them. Document via OpenAPI/Swagger at /docs."
      - "URL configuration: local backend at http://127.0.0.1:8000; frontend reads VITE_API_BASE_URL from frontend/.env.local, with a placeholder in frontend/.env.example. No secrets in frontend env files. Do not hardcode the URL through the source. Backend CORS allows the local frontend origin."
      - "Tests: mocked tests needing no internet, private tokens or large model downloads, covering invalid audio, missing configuration, successful mocked transcription, and alignment errors."
      - "Update the README with installation, model setup, environment variables, API routes and troubleshooting."
  - id: 4.5
    name: "Real frontend-backend integration"
    source: "Summarised from the owner's Milestone 4.5 build prompt, which was received in full."
    tasks:
      - "Connect the React frontend to the FastAPI backend so the dashboard uses real backend results instead of presenting demo fixtures as live analysis. Reuse existing endpoints."
      - "Configure the API client through VITE_API_BASE_URL in frontend/.env.local (ignored by Git)."
      - "Connect audio upload to the transcription and analysis endpoints and display the returned transcript and word-level timestamps."
      - "Provide loading, progress, empty, validation, network-error and backend-unavailable states."
      - "Keep demo fixtures clearly labelled. Never fabricate timestamps or claim flaw detection or baseline comparison exists before it is implemented."
      - "Preserve the visual design, charts and 3D Acoustic Twin; integrate real measurements where available with a graceful fallback."
      - "Verify backend CORS for the local frontend origin; keep HF_TOKEN in the backend only."
      - "Frontend tests with mocked responses for upload, success, errors and empty results."
  - id: 5
    name: "Contrastive speech dataset and stress testing"
    source: "Summarised from the owner's Milestone 5 build prompt, which was received in full."
    tasks:
      - "Versioned dataset schema: sample ID, pair ID, audio paths, transcript, speaker or synthetic-speaker ID, delivery condition, flaw category, severity, timestamps, annotation provenance, dataset version."
      - "Cover excessive pauses, rushed delivery, slow delivery, filler words, uneven pacing, pitch monotony and unclear articulation, only when the data supports the label."
      - "Small demonstration dataset from properly licensed recordings and/or clearly labelled synthetic or transformed samples; never present synthetic audio as natural speech."
      - "Pair examples with the same transcript where possible and document transcript differences."
      - "Severity gradient from clearly flawed to near-reference; distinguish manual labels from automatically measured estimates."
      - "Validation for missing files, invalid timestamps, duplicate IDs, mismatched transcripts, invalid labels and missing metadata."
      - "Reproducible splits without recording or speaker leakage."
      - "Stress-test sample rates, silence, noise, clipped audio, short clips, empty files and unsupported formats."
      - "Dataset card: provenance, licensing, generation methods, annotation, limitations, biases, intended use."
      - "Keep large audio out of Git; include compact licensed examples and document hosting and download."
      - "Fixed seeds, automated dataset-validation tests, a reproducible build command, and no invented sizes, statistics or validation claims."
  - id: 5.1
    name: "Data quality and feature robustness"
    source: "Summarised from the owner's Milestone 5.1 build prompt, which was received in full."
    tasks:
      - "Pitch tracking: investigate unstable estimates for low-pitched speakers (F0 settings, octave errors, voicing, speaker normalisation); validate with varied pitch ranges without hardcoding expected values or claiming untested accuracy."
      - "Pause detection: handle background noise with appropriate noise handling and configurable thresholds; test clean speech, noisy speech, silence and very short pauses."
      - "Clipping detection: a measurable indicator from samples near the amplitude limits, distinguishing detected clipping from an uncertain result."
      - "Transcript quality: a verification workflow; automatic transcripts stay labelled unverified until reviewed; never silently change source descriptions or claim manual verification."
      - "Dataset reproducibility: verify build and validation commands from the documented directories; check timestamps, manifest paths, schema validity, provenance and deterministic output."
      - "Dataset hosting: a reproducible export and upload guide for a public host; never claim publication without a successful upload; never upload private recordings."
      - "Baseline comparison and flaw detection: design the reference-versus-participant interfaces; implement only what actual measurements and valid aligned intervals support; fabricate nothing."
      - "Regression tests for every issue; honest reporting of anything that cannot be fixed reliably."
  # Milestones 6 and later: not yet supplied by the owner.
