# Render blueprint for the SpeakIQ AI Coach backend. Not yet deployed: see docs/DEPLOYMENT.md.
# Secrets are declared with `sync: false`, so Render asks for their values in its dashboard.
# Never write a secret value into this file.
services:
  - type: web
    name: speakiq-ai-coach-api
    runtime: python
    # Render's free instance has 512 MB of RAM. The model and duration limit below are chosen to fit it;
    # see docs/DEPLOYMENT.md for the measurements and for the settings to use on a larger instance.
    plan: free
    rootDir: backend
    # Download the transcription model during the build, into the service's own folder, so the
    # first analysis after a deploy does not have to fetch it.
    buildCommand: pip install -r requirements.txt && python -m app.speech.prefetch
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: APP_ENV
        value: production
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_DOWNLOAD_ROOT
        value: models
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_AUDIO_SECONDS
        value: "60"
      # The deployed frontend's address, for example https://your-app.vercel.app
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Optional. Leave unset to keep saving analyses switched off.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional. Only needed for a private or gated transcription model.
      - key: HF_TOKEN
        sync: false
